# PR Validation for Python Libs
# Pull request validation using supplemental checks workflow.
#
# Uses reusable workflow from: ByronWilliamsCPA/.github
#
# Note: Core CI checks (tests, linting, type checking) are handled by ci.yml.
# This workflow provides additional PR-specific validations.
name: PR Validation

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs for same PR
concurrency:
  # #ASSUME github.event.pull_request.number is null under merge_group;
  # fall back to github.ref (unique per merge-group ref) so a merge-group
  # build never collides with, or is cancelled by, a PR build's group.
  # #VERIFY confirm no cross-cancellation between a PR run and its
  # corresponding merge-group run after the first live merge-queue pass.
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Supplemental PR Checks (Changelog, Link Validation)
  # ==========================================================================
  supplemental-checks:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-supplemental-checks.yml@987d517d3c8e4b180f4dd15de6d9575f0df91182 # main
    with:
      # Changelog enforcement
      enable-changelog-check: true
      changelog-path: 'CHANGELOG.md'
      changelog-skip-labels: 'skip-changelog,dependencies,documentation'

      # Documentation link validation
      enable-link-check: true
      link-check-paths: './docs/**/*.md ./README.md ./CONTRIBUTING.md'
      link-check-fail: false

      # Cruft template sync (already handled by validate-cruft.yml, so skip here)
      enable-cruft-check: false

      # Dependency auto-merge (handled separately)
      enable-automerge: false
    secrets: inherit

  # ==========================================================================
  # Dead Code Detection (not in supplemental-checks, keep inline)
  # ==========================================================================
  dead-code:
    name: Dead Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install UV
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run vulture
        run: |
          echo "## Dead Code Report" >> $GITHUB_STEP_SUMMARY
          uv run vulture src/ packages/ --min-confidence 90 | tee vulture-report.txt || true
          if [ -s vulture-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vulture-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::warning::Potential dead code detected. Review vulture report."
          else
            echo "✅ No dead code detected with 90% confidence." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # Validation Summary
  # Required status check context: "Dependency & Standards Validation"
  # (bare job name matching the org ruleset). Aggregates the PR-validation jobs
  # and fails only if the supplemental (core) checks failed; dead-code is
  # advisory (vulture runs warn-only).
  # ==========================================================================
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    needs: [supplemental-checks, dead-code]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check validation results
        env:
          SUPPLEMENTAL_RESULT: ${{ needs.supplemental-checks.result }}
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
        run: |
          {
            echo "## Dependency & Standards Validation"
            echo ""
            if [ "$SUPPLEMENTAL_RESULT" == "success" ]; then
              echo "✅ Supplemental checks: passed"
            else
              echo "❌ Supplemental checks: $SUPPLEMENTAL_RESULT"
            fi
            if [ "$DEAD_CODE_RESULT" == "success" ]; then
              echo "✅ Dead code check: passed"
            else
              echo "⚠️ Dead code check: $DEAD_CODE_RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUPPLEMENTAL_RESULT" == "failure" ]; then
            echo "::error::Supplemental PR validation failed."
            exit 1
          fi
          echo "Dependency & Standards Validation passed"
