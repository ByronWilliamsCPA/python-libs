# OpenSSF Scorecard for Python Libs
# Security posture assessment and supply chain security validation.
#
# Dashboard: https://securityscorecards.dev/viewer/?uri=github.com/ByronWilliamsCPA/python-libs
# Documentation: https://github.com/ossf/scorecard
#
# Uses reusable workflow from: ByronWilliamsCPA/.github
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesdays at 21:21 UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@e8fc83c98c2971ad1ece71573d28171463e30c16 # main
    with:
      publish-results: true
      upload-sarif: true
      artifact-retention-days: 5
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
