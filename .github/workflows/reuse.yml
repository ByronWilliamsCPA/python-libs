# REUSE Compliance Check for Python Libs
# Validates REUSE 3.0 specification compliance for license management
#
# REUSE helps with clear licensing by using SPDX headers
# Documentation: https://reuse.software/
name: REUSE Compliance

on:
  # No paths filter: "Check REUSE Compliance" is a REQUIRED status check, so it
  # must report on every PR. A paths filter would skip the workflow on changes
  # that do not match (e.g. root-only files like renovate.json, since "**/*"
  # does not match repository-root paths), leaving the required context pending
  # forever and silently blocking the PR.
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions: read-all

jobs:
  # Required status check context: "Check REUSE Compliance" (bare job name, no
  # reusable-workflow slash prefix), matching the org ruleset.
  reuse:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
