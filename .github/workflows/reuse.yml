# REUSE Compliance Check for Python Libs
# Validates REUSE 3.0 specification compliance for license management
#
# REUSE helps with clear licensing by using SPDX headers
# Documentation: https://reuse.software/
#
# Uses reusable workflow from: ByronWilliamsCPA/.github
name: REUSE Compliance

on:
  pull_request:
    paths:
      - "**/*"
      - "REUSE.toml"
      - "LICENSES/**"
      - ".github/workflows/reuse.yml"
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  reuse:
    permissions:
      contents: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-reuse.yml@e8fc83c98c2971ad1ece71573d28171463e30c16 # main
    with:
      generate-spdx: true
      fail-on-missing: true
      artifact-retention-days: 90
