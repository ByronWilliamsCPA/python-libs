[project]
name = "byronwilliamscpa-gemini-image"
version = "0.2.0"
description = "Image generation using Google Gemini models (Nano Banana / Nano Banana Pro)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"}
]
keywords = ["gemini", "image-generation", "ai", "google", "genai", "text-to-image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "google-genai>=1.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gemini-image = "gemini_image.cli:main"

[project.urls]
Homepage = "https://github.com/ByronWilliamsCPA/python-libs"
Repository = "https://github.com/ByronWilliamsCPA/python-libs"
Documentation = "https://github.com/ByronWilliamsCPA/python-libs#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_image"]

# Per-package semantic release configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "gemini-image-v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

# Package-specific ruff overrides
[tool.ruff.lint]
ignore = [
    # Allow exception messages to use string literals and f-strings
    # (common pattern for user-facing errors in libraries)
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    # Allow catching broad exceptions in specific cases (CLI error handling)
    "BLE001",
    # Allow dynamic imports for optional dependencies
    "PLC0415",
    # Allow try-except-return pattern
    "TRY300",
    # Allow logging.error in exception handlers
    "TRY400",
    # Complexity is acceptable for CLI main function and generators
    "C901",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert and have simpler patterns
"tests/*" = ["S101", "PLR2004", "ANN"]
# CLI module can use print statements
"src/gemini_image/cli.py" = ["T201"]

[tool.pytest.ini_options]
markers = [
    "functional: marks tests as functional (requiring GEMINI_API_KEY)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
